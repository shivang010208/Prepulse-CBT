<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect x="24" y="24" width="464" height="464" rx="92" fill="url(#glow)" stroke="#ffffff" stroke-width="2" stroke-opacity="0.2" />

  <!-- Exam Clipboard Icon -->
  <g filter="url(#shadow)" transform="translate(106, 86)">
    <!-- Clipboard body -->
    <rect x="20" y="50" width="260" height="310" rx="28" fill="#ffffff" />
    
    <!-- Top clip handle -->
    <rect x="90" y="32" width="120" height="36" rx="12" fill="#1e293b" />
    <circle cx="150" cy="50" r="8" fill="#ffffff" />

    <!-- Exam lines -->
    <!-- Line 1: Question title -->
    <rect x="52" y="100" width="130" height="14" rx="7" fill="#4f46e5" />
    <circle cx="216" cy="107" r="11" fill="#10b981" />
    <path d="M211 107l3 3 7-7" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Line 2: Question option A -->
    <circle cx="64" cy="142" r="8" fill="#e2e8f0" />
    <rect x="84" y="136" width="150" height="12" rx="6" fill="#94a3b8" />

    <!-- Line 3: Question option B (selected correct) -->
    <circle cx="64" cy="178" r="8" fill="#10b981" />
    <rect x="84" y="172" width="166" height="12" rx="6" fill="#0f172a" />

    <!-- Line 4: Question option C -->
    <circle cx="64" cy="214" r="8" fill="#e2e8f0" />
    <rect x="84" y="208" width="130" height="12" rx="6" fill="#94a3b8" />

    <!-- Line 5: Question option D -->
    <circle cx="64" cy="250" r="8" fill="#e2e8f0" />
    <rect x="84" y="244" width="110" height="12" rx="6" fill="#94a3b8" />

    <!-- Timer Badge overlay at bottom right -->
    <g transform="translate(170, 240)">
      <circle cx="50" cy="50" r="44" fill="#0f172a" stroke="#3b82f6" stroke-width="6" />
      <!-- Clock hands -->
      <path d="M50 24v26l18 10" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <circle cx="50" cy="50" r="4" fill="#ffffff" />
    </g>
  </g>
</svg>
